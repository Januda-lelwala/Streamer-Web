name: Inspect streamer tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List tunnel connectors
        env:
          TUNNEL_TOKEN: ${{ secrets.STREAMER_TUNNEL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          tunnel_id=$(python3 - <<'PY'
          import base64, json, os
          token = os.environ['TUNNEL_TOKEN']
          data = json.loads(base64.b64decode(token + '=' * (-len(token) % 4)))
          print(data['t'])
          PY
          )
          response=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id/connections")
          jq -r 'if .success then .result[] | [.id, ([.conns[].origin_ip] | unique | join(",")), .run_at] | @tsv else .errors[] | [.code, .message] | @tsv end' <<<"$response"
