name: Inspect streamer tunnel

on:
  workflow_dispatch:
    inputs:
      remove_old_connector:
        description: Remove only the connector from 140.245.195.5
        type: boolean
        default: false
      rotate_token:
        description: Rotate token, restart new VPS tunnel, and remove old connector
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: List tunnel connectors
        env:
          TUNNEL_TOKEN: ${{ secrets.STREAMER_TUNNEL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          tunnel_id=$(python3 - <<'PY'
          import base64, json, os
          token = os.environ['TUNNEL_TOKEN']
          data = json.loads(base64.b64decode(token + '=' * (-len(token) % 4)))
          print(data['t'])
          PY
          )
          response=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id/connections")
          jq -r 'if .success then .result[] | [.id, ([.conns[].origin_ip] | unique | join(",")), .run_at] | @tsv else .errors[] | [.code, .message] | @tsv end' <<<"$response"
          if [[ '${{ inputs.remove_old_connector }}' == 'true' ]]; then
            old_id=$(jq -r '[.result[] | select(([.conns[].origin_ip] | unique) == ["140.245.195.5"]) | .id] | if length == 1 then .[0] else error("Expected exactly one old connector") end' <<<"$response")
            jq -e '[.result[] | select(([.conns[].origin_ip] | index("3.239.72.208")) != null)] | length >= 1' <<<"$response" >/dev/null
            curl --silent --show-error --fail-with-body -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id/connections?client_id=$old_id" \
              | jq -e '.success'
          fi
      - name: Rotate token and replace new connector
        if: ${{ inputs.rotate_token }}
        env:
          TUNNEL_TOKEN: ${{ secrets.STREAMER_TUNNEL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_HOST: ${{ secrets.STREAMER_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.STREAMER_VPS_USER }}
          DEPLOY_KEY: ${{ secrets.STREAMER_VPS_DEPLOY_KEY }}
          HOST_FINGERPRINT: ${{ secrets.STREAMER_VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" == '3.239.72.208' ]]
          tunnel_id=$(python3 - <<'PY'
          import base64, json, os
          token = os.environ['TUNNEL_TOKEN']
          print(json.loads(base64.b64decode(token + '=' * (-len(token) % 4)))['t'])
          PY
          )
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/streamer_deploy"
          chmod 600 "$HOME/.ssh/streamer_deploy"
          ssh-keyscan -T 15 -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')" = "$HOST_FINGERPRINT"
          old_connections=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id/connections")
          old_id=$(jq -r '[.result[] | select(([.conns[].origin_ip] | unique) == ["140.245.195.5"]) | .id] | if length == 1 then .[0] else error("Expected exactly one old connector") end' <<<"$old_connections")
          jq -e '[.result[] | select(([.conns[].origin_ip] | index("3.239.72.208")) != null)] | length >= 1' <<<"$old_connections" >/dev/null
          secret=$(openssl rand -base64 32)
          patch=$(jq -n --arg secret "$secret" '{tunnel_secret:$secret}')
          curl --fail --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$patch" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id" \
            | jq -e '.success' >/dev/null
          current_token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id/token" \
            | jq -er '.result')
          stage="/tmp/streamer-tunnel-token-$GITHUB_RUN_ID"
          printf '%s\n' "$current_token" | ssh -i "$HOME/.ssh/streamer_deploy" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '$stage'; sudo install -o streamer -g streamer -m 600 '$stage' /etc/streamer-tunnel.token; rm '$stage'; sudo systemctl restart streamer-tunnel; sudo systemctl is-active --quiet streamer-tunnel"
          curl --fail --silent --show-error -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id/connections?client_id=$old_id" \
            | jq -e '.success' >/dev/null
          echo 'Rotated tunnel token and disconnected the old connector.'
