name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker
  cancel-in-progress: false

jobs:
  build-backend:
    if: ${{ vars.STREAMER_BACKEND_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package backend
        run: |
          mkdir -p .next/standalone/.next
          cp -a .next/static .next/standalone/.next/static
          tar -czf "$RUNNER_TEMP/backend.tar.gz" -C .next/standalone .
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.STREAMER_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.STREAMER_VPS_USER }}
          DEPLOY_KEY: ${{ secrets.STREAMER_VPS_DEPLOY_KEY }}
          HOST_FINGERPRINT: ${{ secrets.STREAMER_VPS_HOST_FINGERPRINT }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$HOST_FINGERPRINT"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/streamer_deploy"
          chmod 600 "$HOME/.ssh/streamer_deploy"
          ssh-keyscan -T 15 -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          test "$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk '{print $2}')" = "$HOST_FINGERPRINT"
      - name: Deploy backend to VPS
        env:
          DEPLOY_HOST: ${{ secrets.STREAMER_VPS_HOST }}
          DEPLOY_USER: ${{ secrets.STREAMER_VPS_USER }}
          BACKEND_TOKEN: ${{ secrets.STREAMER_BACKEND_TOKEN }}
          TUNNEL_TOKEN: ${{ secrets.STREAMER_TUNNEL_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$BACKEND_TOKEN" && test -n "$TUNNEL_TOKEN"
          [[ "$BACKEND_TOKEN" =~ ^[a-zA-Z0-9_-]{32,}$ ]]
          tunnel_id=$(python3 - <<'PY'
          import base64, json, os
          token = os.environ['TUNNEL_TOKEN']
          print(json.loads(base64.b64decode(token + '=' * (-len(token) % 4)))['t'])
          PY
          )
          current_token=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tunnel_id/token" \
            | jq -er '.result')
          [[ "$current_token" != *$'\n'* ]]
          stage="$RUNNER_TEMP/streamer-deploy"
          mkdir -m 700 "$stage"
          trap 'rm -rf "$stage"' EXIT
          printf 'STREAM_BACKEND_TOKEN=%s\nMAX_ACTIVE_TORRENTS=2\nMAX_TORRENT_BYTES=8589934592\n' "$BACKEND_TOKEN" > "$stage/backend.env"
          printf '%s\n' "$current_token" > "$stage/tunnel.token"
          chmod 600 "$stage/backend.env" "$stage/tunnel.token"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_stage="/tmp/streamer-deploy-$GITHUB_SHA"
          ssh -i "$HOME/.ssh/streamer_deploy" -o BatchMode=yes "$target" "mkdir -p -m 700 '$remote_stage' && chmod 700 '$remote_stage'"
          scp -i "$HOME/.ssh/streamer_deploy" -o BatchMode=yes "$RUNNER_TEMP/backend.tar.gz" "$stage/backend.env" "$stage/tunnel.token" deploy-vps.sh "$target:$remote_stage/"
          ssh -i "$HOME/.ssh/streamer_deploy" -o BatchMode=yes "$target" "bash '$remote_stage/deploy-vps.sh' '$GITHUB_SHA'"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  connect-backend:
    if: ${{ vars.STREAMER_BACKEND_ENABLED == 'true' }}
    needs: [build-backend, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Verify tunnel and update Worker secrets
        env:
          BACKEND_URL: ${{ vars.STREAMER_BACKEND_URL }}
          BACKEND_TOKEN: ${{ secrets.STREAMER_BACKEND_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$BACKEND_URL" && test -n "$BACKEND_TOKEN"
          [[ "$BACKEND_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]]
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "${BACKEND_URL%/}/" -o /dev/null
          printf '%s' "$BACKEND_TOKEN" | npx wrangler secret put TORRENT_BACKEND_TOKEN --name web
          printf '%s' "${BACKEND_URL%/}" | npx wrangler secret put TORRENT_BACKEND_URL --name web
